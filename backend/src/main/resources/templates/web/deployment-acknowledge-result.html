<!--
================================================================================
WEB PAGE TEMPLATE: Deployment Assessment — Acknowledge Result / Status Notice
FILE: templates/web/deployment-acknowledge-result.html
--------------------------------------------------------------------------------
WHEN IT IS USED:
  Rendered after an administrator submits the confirmation form, or when the
  link is accessed after the request has already been acknowledged.
  Provides a clear status receipt without allowing duplicate actions.

SUPPORTED PLACEHOLDERS:
  - {{title}}                   : Main header (e.g. Application Successfully Acknowledged)
  - {{statusBadge}}             : Status pill label (e.g. IN_REVIEW)
  - {{referenceCode}}           : Tracking Reference Code (e.g. FAB-2026-XXXXXXXX)
  - {{millName}}                : Factory / Mill Name
  - {{email}}                   : Recipient Email Address
  - {{message}}                 : Summary message
  - {{detailNote}}              : Follow-up explanatory text
================================================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — FABINS@NEVOLYN</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background-color: #f1f5f9;
      margin: 0;
      padding: 50px 16px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      padding: 40px 32px;
      text-align: center;
    }

    .brand-tag {
      font-size: 13px;
      font-weight: 700;
      color: #0284c7;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .status-badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 5px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 18px;
      border: 1px solid #bae6fd;
    }

    .icon {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 14px;
      color: #16a34a;
    }

    .page-title {
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px 0;
    }

    .summary-text {
      font-size: 15px;
      color: #334155;
      margin-bottom: 16px;
      line-height: 1.55;
    }

    .info-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      text-align: left;
    }

    .ref-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: #0369a1;
      background-color: #e0f2fe;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #bae6fd;
    }

    .footer-note {
      color: #94a3b8;
      font-size: 12px;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="brand-tag">FABINS@NEVOLYN</div>

    <div class="status-badge">Status: {{statusBadge}}</div>

    <h1 class="page-title">{{title}}</h1>

    <p class="summary-text">{{message}}</p>

    <div class="info-card">
      <div style="margin-bottom: 6px;"><strong>Tracking Reference Code:</strong> <span
          class="ref-pill">{{referenceCode}}</span></div>
      <div style="margin-bottom: 6px;"><strong>Mill Name:</strong> <strong>{{millName}}</strong></div>
      <div><strong>Applicant Email:</strong> {{email}}</div>
    </div>

    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">
      {{detailNote}}
    </p>

    <div class="footer-note">
      This is an internal operational record. No further automated action is needed.
    </div>
  </div>

</body>

</html>
