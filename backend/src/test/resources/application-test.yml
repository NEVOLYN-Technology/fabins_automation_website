# =============================================================================
# `test` profile — used by the automated test suite.
#
# Kept separate from `dev` so that running the tests never touches a database a
# developer is using, and so test output stays quiet.
# =============================================================================

spring:
  datasource:
    # A fresh in-memory database per test run. MODE=PostgreSQL matches
    # production syntax so the real Flyway migrations run here too — the schema
    # under test is the schema that ships.
    url: jdbc:h2:mem:fabins-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

fabins:
  cors:
    allowed-origins:
      - http://localhost:3000
  admin:
    username: test-admin
    password: test-password

SUPER_ADMIN_1_USERNAME: mninadmnobo
SUPER_ADMIN_SHARED_PASSWORD: test-password

logging:
  level:
    root: WARN
    com.fabins: INFO