# =============================================================================
# FABINS — Full Stack Docker Compose Local & Production Stack
#
# Launches:
#   1. PostgreSQL 16 DB (Port 5432)
#   2. Spring Boot 3 REST API (Port 8080)
#   3. Next.js 16 Web App (Port 3000)
#
# Quick Start Commands:
#   - Start full stack:        docker compose up --build
#   - Run in background (-d):   docker compose up -d --build
#   - View live logs:          docker compose logs -f
#   - Stop stack & volumes:    docker compose down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE SERVICE — PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fabins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fabins}
      POSTGRES_USER: ${POSTGRES_USER:-fabins_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabins_secret_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabins_user} -d ${POSTGRES_DB:-fabins}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. BACKEND SERVICE — Spring Boot REST API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fabins-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fabins}
      DATABASE_USERNAME: ${POSTGRES_USER:-fabins_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-fabins_secret_pass}
      FABINS_ADMIN_USERNAME: ${FABINS_ADMIN_USERNAME:-admin}
      FABINS_ADMIN_PASSWORD: ${FABINS_ADMIN_PASSWORD:-admin123}
      FABINS_ALLOWED_ORIGIN: ${FABINS_ALLOWED_ORIGIN:-http://localhost:3000}
      # Origin used to build acknowledge links inside emails. Points at the
      # host's published port, not the container's, because the link is opened
      # from a mail client outside the Compose network.
      FABINS_BACKEND_URL: ${FABINS_BACKEND_URL:-http://localhost:8080}
      # 465 (implicit SSL), matching application.yml. The REST engine takes over
      # whenever SPRING_MAIL_PASSWORD is a Brevo key; blank means emails are
      # logged rather than sent, which is the default here.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mail.nevolyn.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-fabins@nevolyn.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM:-fabins@nevolyn.com}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. FRONTEND SERVICE — Next.js 16 Web Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fabins-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Origin only. The browser resolves this, not the container, so it must be
      # the host-published address rather than the `backend` service name.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"

# -----------------------------------------------------------------------------
# PERSISTENT VOLUMES
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
